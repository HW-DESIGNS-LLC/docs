# =============================================================================
#  Crescent City - ESPHome configuration
#  ESP32-S3 dev board with a built-in 0.96" OLED and protected LiPo power
#  Docs: https://docs.hwdesigns.us/esp32-s3/esphome/
#
#  What you get in Home Assistant
#    Indoor temperature + humidity (SHT4x on the Qwiic port), battery voltage,
#    battery level, charging state, USB power, battery-low alert, BOOT button,
#    RGB LED (light), status LED switch, low-battery shutdown switch, battery
#    calibration offset, Wi-Fi signal, IP address.
#  On the OLED
#    Clock (time from Home Assistant), indoor and outdoor temperature, battery
#    gauge. Press BOOT to switch to the status page (Wi-Fi, IP, battery).
#  Battery (same settings as the Weather Clock firmware 2.1.6; not yet verified on hardware)
#    - On battery: level = charge left before the low-battery shutdown, from a
#      table measured on a V2.0 board. 0 bars only in the last 5 %.
#    - On USB: the battery reading is the charger output, so the icon shows the
#      charging phase instead: bars run while charging, 3 bars + 4th blinking
#      while the charger tops off, 4 bars when it stops ("Charging" entity).
#      With the battery already full, or no battery fitted, the charger stays
#      idle: after 20 min the icon shows 4 bars and "Charging" says
#      "Not charging" (the CHG LED is off in both cases).
#    - "LOW" warning at 3.45 V, then "Battery low / charge me" and deep sleep
#      at 3.30 V until USB is plugged in. A 10-minute timer check backs up the
#      USB wake. After a shutdown, the board on battery needs 3.50 V to keep
#      running, so a short USB connection sends it back to sleep.
#  Wi-Fi stays connected on battery (Home Assistant needs it), so battery life
#  is shorter than the Weather Clock's (not measured yet; the Weather Clock
#  with Wi-Fi always on measured about 14-14.5 h per 1000 mAh).
#
#  Use it as is (web installer or "Adopt" in ESPHome Builder), or as a package:
#    packages:
#      hwdesigns.crescent-city: github://HW-DESIGNS-LLC/docs/esp32-s3/firmware/esphome/crescent-city.yaml@main
#
#  Board pin map (identical on board versions V1.0 and V2.0)
#    OLED SSD1306 SPI  SCLK 12, MOSI 11, CS 10, DC 9, RST 14
#    Qwiic I2C         SDA 8, SCL 18
#    RGB LED SK6812    GPIO48          BOOT button  GPIO0
#    Battery sense     GPIO4  (100k/100k divider)
#    USB present       GPIO2  (100k/100k divider from USB 5 V; RTC pin, wakes the board)
#
#  MIT License - Copyright (c) 2026 HW DESIGNS LLC
# =============================================================================

substitutions:
  name: crescent-city
  friendly_name: Crescent City
  # OLED only. Home Assistant shows temperatures in its own unit setting.
  # Set this to match Home Assistant, because the outdoor value comes from it.
  temp_unit: "F"
  # Home Assistant weather entity for the outdoor temperature on the OLED.
  outdoor_weather_entity: weather.forecast_home
  # Low-battery cutoff. Voltages are at the battery connector. Keep these the
  # same as the weather-clock firmware (LOW-BATTERY CUTOFF block).
  vbat_cal_offset: "0.070"    # V added to the ADC reading
  vbat_warn: "3.45"           # below: battery-low warning
  vbat_warn_clear: "3.55"     # above: warning clears
  vbat_cutoff: "3.30"         # below (30 s median): shut down to deep sleep
  vbat_resume: "3.50"         # at boot on battery: below this, back to sleep

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  comment: "Crescent City ESP32-S3 OLED board"
  project:
    name: hwdesigns.crescent-city
    version: "1.1.1"
  on_boot:
    # Very first: release the pin holds set before a low-battery deep sleep.
    #   On a timer wake (USB check) the holds stay on until USB is confirmed.
    - priority: 1100
      then:
        - lambda: |-
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER) return;
            gpio_hold_dis(GPIO_NUM_48);
            gpio_hold_dis(GPIO_NUM_10);
            gpio_hold_dis(GPIO_NUM_14);
            gpio_deep_sleep_hold_dis();
    # Timer wake from the low-battery sleep: check USB on the ADC before the
    # display and Wi-Fi start; without USB go straight back to sleep.
    - priority: 590
      then:
        - lambda: |-
            if (esp_sleep_get_wakeup_cause() != ESP_SLEEP_WAKEUP_TIMER) return;
            if (id(usb_adc).sample() * 2.0f <= 4.0f) {
              gpio_hold_en(GPIO_NUM_48);
              gpio_hold_en(GPIO_NUM_10);
              gpio_hold_en(GPIO_NUM_14);
              gpio_deep_sleep_hold_en();
              id(deep_sleep_ctl).begin_sleep(true);
            }
            ESP_LOGI("battery", "Woke from low-battery sleep: USB found on timer check");
            gpio_hold_dis(GPIO_NUM_48);
            gpio_hold_dis(GPIO_NUM_10);
            gpio_hold_dis(GPIO_NUM_14);
            gpio_deep_sleep_hold_dis();
    # After the display and ADC are up, before Wi-Fi starts: a battery that is
    # still empty after a reset goes straight back to sleep (Wi-Fi never starts).
    - priority: 300
      then:
        - lambda: |-
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1)
              ESP_LOGI("battery", "Woke from low-battery sleep: USB plugged in");
            if (!id(low_battery_shutdown_enabled).state) return;
            if (id(usb_adc).sample() * 2.0f > 4.0f) return;
            float v = 0;
            for (int i = 0; i < 10; i++) { v += id(battery_adc).sample(); delay(20); }
            v = v / 10.0f * 2.0f + id(vbat_offset).state;
            ESP_LOGI("battery", "Boot check: %.3f V (resume above %.2f V)", v, ${vbat_resume});
            if (v >= ${vbat_resume}) { id(lb_after_cut) = false; return; }
            // Still empty: same shutdown as at runtime, done here before Wi-Fi.
            id(lowbatt_v) = v;
            id(show_lowbatt) = true;
            id(oled).update();
            uint32_t t0 = millis();
            while (millis() - t0 < 10000) {
              App.feed_wdt();
              if (id(usb_adc).sample() * 2.0f > 4.0f) App.safe_reboot();
              delay(100);
            }
            id(sleep_prepare).execute();
            id(deep_sleep_ctl).begin_sleep(true);

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  id: api_id
  reboot_timeout: 0s          # keep running as a clock when Home Assistant is offline

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  id: wifi_id
  reboot_timeout: 0s          # keep the clock running if Wi-Fi drops (default reboots after 15 min)
  # Credentials come from the web installer, the setup hotspot or your
  # ESPHome Builder secrets. With no saved network, the board opens the
  # setup hotspot below.
  ap:
    ssid: "Crescent City"

captive_portal:

improv_serial:

dashboard_import:
  package_import_url: github://HW-DESIGNS-LLC/docs/esp32-s3/firmware/esphome/crescent-city.yaml@main
  import_full_config: false

deep_sleep:
  id: deep_sleep_ctl
  # The board sleeps only on a low battery (no run_duration). It wakes when USB
  # is plugged in (GPIO2 goes high) or RESET is pressed, and every 10 min for a
  # quick USB check in case GPIO2 does not reach its logic-high level.
  sleep_duration: 10min
  esp32_ext1_wakeup:
    pins:
      - number: GPIO2
        allow_other_uses: true
    mode: ANY_HIGH

globals:
  - id: page
    type: int
    initial_value: "0"
  - id: show_lowbatt
    type: bool
    initial_value: "false"
  - id: low_batt_warn
    type: bool
    initial_value: "false"
  - id: lowbatt_v
    type: float
    initial_value: "0"
  - id: led_code
    type: int
    initial_value: "-1"
  - id: vbat_n                # battery readings since boot / USB unplugged
    type: int
    initial_value: "0"
  - id: cut_now
    type: bool
    initial_value: "false"
  - id: lb_after_cut          # set at a low-battery shutdown; then 3.50 V is needed to keep running
    type: bool
    restore_value: true
    initial_value: "false"
  - id: chg_state             # 0 on battery, 1 charging, 2 topping off, 3 full, 4 charger idle (full or no battery)
    type: int
    initial_value: "0"
  - id: chg_sum               # battery readings summed over the current minute (on USB)
    type: float
    initial_value: "0"
  - id: chg_cnt
    type: int
    initial_value: "0"

time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------- buses
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

i2c:
  sda: GPIO8
  scl: GPIO18
  frequency: 100kHz
  scan: true

# ---------------------------------------------------------------- sensors
sensor:
  # Battery: raw reading every 3 s at the battery connector
  - platform: adc
    id: battery_adc
    pin: GPIO4
    attenuation: 12db
    samples: 16
    update_interval: 3s
    internal: true
    filters:
      - lambda: "return x * 2.0f + id(vbat_offset).state;"
    on_value:
      - lambda: |-
          if (id(usb_power).state) { id(chg_sum) += x; id(chg_cnt)++; }

  # 30 s median, updated every 3 s - drives the warning and the cutoff
  - platform: copy
    source_id: battery_adc
    id: battery_filtered
    internal: true
    filters:
      - median:
          window_size: 10
          send_every: 1
    on_value:
      then:
        - lambda: |-
            id(cut_now) = false;
            if (id(usb_power).state || !id(low_battery_shutdown_enabled).state) {
              id(low_batt_warn) = false;
              id(vbat_n) = 0;
              return;
            }
            if (id(vbat_n) < 10) { id(vbat_n)++; return; }   // first decision after 30 s on battery
            if (id(lb_after_cut)) {
              if (x >= ${vbat_resume}) {
                id(lb_after_cut) = false;                       // recharged enough: normal rules again
              } else {
                ESP_LOGW("battery", "On battery at %.3f V after a low-battery shutdown (resume above %.2f V)", x, ${vbat_resume});
                id(lowbatt_v) = x;
                id(cut_now) = true;
                return;
              }
            }
            if (!id(low_batt_warn) && x < ${vbat_warn}) {
              id(low_batt_warn) = true;
              ESP_LOGW("battery", "Battery low: %.3f V", x);
            } else if (id(low_batt_warn) && x > ${vbat_warn_clear}) {
              id(low_batt_warn) = false;
            }
            if (x < ${vbat_cutoff}) {
              id(lowbatt_v) = x;
              id(cut_now) = true;
            }
        - if:
            condition:
              lambda: "return id(cut_now);"
            then:
              - script.execute: low_battery_shutdown

  # Reported to Home Assistant every 30 s
  - platform: copy
    source_id: battery_adc
    id: battery_voltage
    name: "Battery voltage"
    device_class: voltage
    state_class: measurement
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 10
          send_every: 10
          send_first_at: 10

  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Battery level"
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      # On battery: charge left before the low-battery shutdown (3.30 V = 0 %),
      # table measured on a V2.0 board (18650 cell, ~41 mA load). On USB the
      # reading is the charger output: report 100 % when the charger has
      # stopped, otherwise keep the last value.
      - lambda: |-
          if (id(usb_power).state) {
            if (id(chg_state) == 3) return 100.0f;
            return {};
          }
          static const float P[][2] = {{4.10f,100},{4.02f,95},{4.00f,90},{3.98f,80},{3.96f,70},
            {3.92f,60},{3.86f,50},{3.82f,40},{3.80f,30},{3.75f,20},{3.71f,15},{3.68f,10},
            {3.61f,5},{3.47f,2},{3.30f,0}};
          const int n = sizeof(P) / sizeof(P[0]);
          if (x >= P[0][0]) return 100.0f;
          for (int i = 0; i < n - 1; i++) {
            if (x <= P[i][0] && x >= P[i + 1][0])
              return P[i + 1][1] + (x - P[i + 1][0]) * (P[i][1] - P[i + 1][1]) / (P[i][0] - P[i + 1][0]);
          }
          return 0.0f;

  # USB 5 V present (read as analog: the divided 5 V sits near the logic threshold)
  - platform: adc
    id: usb_adc
    pin:
      number: GPIO2
      allow_other_uses: true
    attenuation: 12db
    update_interval: 1s
    internal: true
    filters:
      - multiply: 2.0

  # Indoor temperature/humidity on the Qwiic port (Qwiic is not hot-plug in
  # ESPHome: plug the sensor in before power-up)
  - platform: sht4x
    address: 0x44
    update_interval: 30s
    temperature:
      id: indoor_temp
      name: "Indoor temperature"
    humidity:
      id: indoor_rh
      name: "Indoor humidity"

  # Outdoor temperature for the OLED, from Home Assistant
  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${outdoor_weather_entity}
    attribute: temperature
    internal: true

  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    id: uptime_s
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: analog_threshold
    id: usb_power
    name: "USB power"
    sensor_id: usb_adc
    device_class: power
    threshold:
      upper: 4.0
      lower: 3.8

  - platform: template
    id: battery_low
    name: "Battery low"
    device_class: battery
    lambda: "return id(low_batt_warn);"

  - platform: gpio
    id: boot_button
    name: "BOOT button"
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - lambda: "id(page) = 1 - id(page);"
      - component.update: oled

text_sensor:
  - platform: template
    id: charge_text
    name: "Charging"
    icon: mdi:battery-charging
    update_interval: never

  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: "IP address"
      entity_category: diagnostic

number:
  # Per-board battery-reading correction, added to the ADC reading. To set it,
  # measure the battery connector (+ to board GND) with a meter while on battery
  # and adjust until "Battery voltage" matches.
  - platform: template
    id: vbat_offset
    name: "Battery offset"
    icon: mdi:tune-vertical
    entity_category: config
    unit_of_measurement: V
    min_value: 0.0
    max_value: 0.2
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${vbat_cal_offset}

switch:
  - platform: template
    id: low_battery_shutdown_enabled
    name: "Low-battery shutdown"
    icon: mdi:battery-alert-variant-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: status_led_enabled
    name: "Status LED"
    icon: mdi:led-on
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - light.turn_off: status_rgb
      - globals.set:
          id: led_code
          value: "-1"

button:
  - platform: restart
    name: "Restart"
  - platform: factory_reset
    name: "Factory reset"
    disabled_by_default: true

# ---------------------------------------------------------------- RGB LED
light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: "RGB LED"
    pin: GPIO48
    num_leds: 1
    chipset: SK6812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - strobe:
          name: "Blink blue"
          colors:
            - state: true
              brightness: 40%
              red: 0%
              green: 0%
              blue: 100%
              duration: 150ms
            - state: false
              duration: 850ms
      - strobe:
          name: "Blink red"
          colors:
            - state: true
              brightness: 40%
              red: 100%
              green: 0%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 1850ms

# Charging state on USB, from 1-minute averages of the battery reading
# (same rule as the Weather Clock 2.1.6): "topping off" when the average is at
# or above 4.15 V and changed less than 4 mV over 10 min; "full" when it falls
# 10 mV below the slowly-tracked top-off level for 3 minutes in a row (the
# charger stopped); fallback "full" after 10 h; back to charging below 4.00 V.
# "Not charging" (charger idle: battery already full, or no battery) when the
# average stays between 4.00 and 4.15 V and within 6 mV for 20 min; while
# charging it always moves more than that. Back to charging if it moves 15 mV.
# Status colours (when the "Status LED" switch is on):
#   red blink = battery low, blue blink = no Wi-Fi (or setup hotspot open),
#   amber = Wi-Fi up but Home Assistant not connected, off = all good.
interval:
  - interval: 60s
    then:
      - lambda: |-
          static float hist[21];
          static int n = 0, below = 0;
          static float plateau = 0;
          static uint32_t t_state = 0;
          static const char *const NAMES[] = {"On battery", "Charging", "Topping off", "Full", "Not charging"};
          int st = id(chg_state);
          if (!id(usb_power).state) {
            st = 0; n = 0;
          } else {
            if (st == 0) { st = 1; t_state = millis(); n = 0; }
            if (id(chg_cnt) > 0) {
              float avg = id(chg_sum) / id(chg_cnt);
              if (n < 21) hist[n++] = avg; else { for (int i = 0; i < 20; i++) hist[i] = hist[i + 1]; hist[20] = avg; }
              uint32_t now = millis();
              if (st == 1) {
                if (n >= 11 && avg >= 4.15f && fabsf(hist[n - 1] - hist[n - 11]) <= 0.004f) {
                  plateau = avg; below = 0; st = 2; t_state = now;
                } else if (n == 21 && avg >= 4.00f && avg < 4.15f) {
                  float lo = hist[0], hi = hist[0];
                  for (int i = 1; i < 21; i++) { lo = fminf(lo, hist[i]); hi = fmaxf(hi, hist[i]); }
                  if (hi - lo <= 0.006f) { plateau = avg; st = 4; t_state = now; }
                }
              } else if (st == 2) {
                float dif = avg - plateau;
                if (dif > -0.005f) plateau += (dif > 0 ? 0.03f : 0.10f) * dif;
                below = (avg <= plateau - 0.010f) ? below + 1 : 0;
                if (below >= 3 || now - t_state >= 600UL * 60000UL) { st = 3; t_state = now; }
              } else if (st == 3) {
                if (avg < 4.00f) { st = 1; t_state = now; n = 0; }
              } else if (st == 4) {
                if (fabsf(avg - plateau) > 0.015f) { st = 1; t_state = now; n = 0; }
              }
              if (st != id(chg_state)) ESP_LOGI("charge", "%s (1-min average %.3f V)", NAMES[st], avg);
            }
          }
          id(chg_sum) = 0; id(chg_cnt) = 0;
          if (st != id(chg_state) || !id(charge_text).has_state()) {
            id(chg_state) = st;
            id(charge_text).publish_state(NAMES[st]);
          }

  - interval: 1s
    then:
      - lambda: |-
          if (!id(status_led_enabled).state || id(show_lowbatt)) return;
          int code = id(low_batt_warn) ? 1 : !id(wifi_id).is_connected() ? 2 : !id(api_id).is_connected() ? 3 : 0;
          if (code == id(led_code)) return;
          id(led_code) = code;
          auto call = code == 0 ? id(status_rgb).turn_off() : id(status_rgb).turn_on();
          if (code == 1) call.set_effect("Blink red");
          if (code == 2) call.set_effect("Blink blue");
          if (code == 3) { call.set_effect("None"); call.set_rgb(1.0, 0.45, 0.0); call.set_brightness(0.25); }
          call.perform();

# ---------------------------------------------------------------- shutdown
script:
  # Pins that could wake a load during deep sleep are parked and held:
  # RGB data low (the LED cannot latch a colour from noise), OLED chip-select
  # high (panel ignores the bus), OLED reset high (panel stays asleep).
  - id: sleep_prepare
    then:
      - lambda: |-
          id(oled).turn_off();
          gpio_reset_pin(GPIO_NUM_48);
          gpio_set_direction(GPIO_NUM_48, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_48, 0);
          gpio_set_level(GPIO_NUM_10, 1);
          gpio_set_level(GPIO_NUM_14, 1);
          gpio_hold_en(GPIO_NUM_48);
          gpio_hold_en(GPIO_NUM_10);
          gpio_hold_en(GPIO_NUM_14);
          gpio_deep_sleep_hold_en();

  - id: low_battery_shutdown
    mode: single
    then:
      - logger.log:
          level: WARN
          format: "Battery %.3f V - shutting down until USB is plugged in"
          args: ["id(lowbatt_v)"]
      - globals.set:
          id: show_lowbatt
          value: "true"
      - globals.set:
          id: lb_after_cut
          value: "true"
      - light.turn_off:
          id: status_rgb
          transition_length: 0s
      - component.update: oled
      - delay: 1s               # let the last state reach Home Assistant
      - wifi.disable:
      - wait_until:
          condition:
            binary_sensor.is_on: usb_power
          timeout: 9s
      - if:
          condition:
            binary_sensor.is_on: usb_power
          then:
            - lambda: "App.safe_reboot();"
      - script.execute: sleep_prepare
      - deep_sleep.enter: deep_sleep_ctl

# ---------------------------------------------------------------- display
font:
  - file: "gfonts://Archivo@700"
    id: font_clock
    size: 24
    glyphs: "0123456789:-"
  - file: "gfonts://Archivo@700"
    id: font_head
    size: 15
  - file: "gfonts://Archivo@600"
    id: font_value
    size: 18
    glyphs: "0123456789-.°%CF "
  - file: "gfonts://Spline Sans Mono"
    id: font_small
    size: 10

display:
  - platform: ssd1306_spi
    id: oled
    model: "SSD1306 128x64"
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO14
    update_interval: 1s
    lambda: |-
      const bool unit_f = std::string("${temp_unit}") == "F";
      auto to_disp = [&](float c) { return unit_f ? c * 9.0f / 5.0f + 32.0f : c; };

      // ---- low-battery screen ----
      if (id(show_lowbatt)) {
        it.rectangle(47, 2, 30, 14);
        it.filled_rectangle(77, 6, 3, 6);
        it.print(64, 34, id(font_head), TextAlign::BASELINE_CENTER, "Battery low");
        it.print(64, 50, id(font_small), TextAlign::BASELINE_CENTER, "charge me");
        it.printf(64, 63, id(font_small), TextAlign::BASELINE_CENTER, "%.2f V", id(lowbatt_v));
        return;
      }

      // ---- battery icon, top right (blinks with LOW when the battery is low) ----
      const bool usb = id(usb_power).state;
      const bool warn = id(low_batt_warn) && !usb;
      float pct = id(battery_level).has_state() ? id(battery_level).state : 0;
      // On battery: 0-4 bars with hysteresis (0 bars only in the last 5 %).
      static int lv = -1;
      static const int up[] = {8, 29, 49, 74}, down[] = {5, 25, 45, 70};
      if (lv < 0) { lv = 0; while (lv < 4 && pct > down[lv]) lv++; }
      while (lv < 4 && pct >= up[lv]) lv++;
      while (lv > 0 && pct < down[lv - 1]) lv--;
      int bars = lv;
      // On USB: charging phase instead of a level.
      if (usb) {
        const int st = id(chg_state);
        bars = st >= 3 ? 4 : st == 2 ? 3 + (int)((millis() / 500) % 2) : (int)((millis() / 600) % 5);
      }
      const int bx = 106, by = 2;
      if (!warn || (millis() / 1000) % 2 == 0) {
        it.rectangle(bx, by, 20, 10);
        it.filled_rectangle(bx + 20, by + 3, 2, 4);
      }
      for (int i = 0; i < bars; i++) it.filled_rectangle(bx + 2 + i * 4, by + 2, 3, 6);
      if (usb) {
        it.line(bx - 4, by + 1, bx - 7, by + 5);
        it.line(bx - 7, by + 5, bx - 5, by + 5);
        it.line(bx - 5, by + 5, bx - 8, by + 9);
      }
      if (warn) it.print(bx - 3, by + 9, id(font_small), TextAlign::BASELINE_RIGHT, "LOW");

      if (id(page) == 0) {
        // ---- clock page ----
        auto now = id(ha_time).now();
        if (now.is_valid()) {
          it.strftime(0, 0, id(font_clock), TextAlign::TOP_LEFT, "%H:%M", now);
          it.strftime(127, 31, id(font_small), TextAlign::BASELINE_RIGHT, "%a %d %b", now);
        } else {
          it.print(0, 0, id(font_clock), TextAlign::TOP_LEFT, "--:--");
        }
        it.print(0, 42, id(font_small), TextAlign::BASELINE_LEFT, "INDOOR");
        it.print(127, 42, id(font_small), TextAlign::BASELINE_RIGHT, "OUTDOOR");
        if (id(indoor_temp).has_state() && !std::isnan(id(indoor_temp).state)) {
          it.printf(0, 63, id(font_value), TextAlign::BASELINE_LEFT, "%.0f°%s", to_disp(id(indoor_temp).state), "${temp_unit}");
          if (id(indoor_rh).has_state() && !std::isnan(id(indoor_rh).state))
            it.printf(52, 63, id(font_small), TextAlign::BASELINE_LEFT, "%.0f%%", id(indoor_rh).state);
        } else {
          it.print(0, 63, id(font_value), TextAlign::BASELINE_LEFT, "--");
        }
        if (id(outdoor_temp).has_state() && !std::isnan(id(outdoor_temp).state))
          it.printf(127, 63, id(font_value), TextAlign::BASELINE_RIGHT, "%.0f°%s", id(outdoor_temp).state, "${temp_unit}");
        else
          it.print(127, 63, id(font_value), TextAlign::BASELINE_RIGHT, "--");
      } else {
        // ---- status page ----
        it.print(0, 9, id(font_small), TextAlign::BASELINE_LEFT, "STATUS");
        if (id(wifi_id).is_connected()) {
          it.printf(0, 19, id(font_small), TextAlign::BASELINE_LEFT, "WiFi %.0f dBm", id(wifi_rssi).state);
          it.printf(0, 29, id(font_small), TextAlign::BASELINE_LEFT, "%s", id(ip_addr).state.c_str());
        } else {
          it.print(0, 19, id(font_small), TextAlign::BASELINE_LEFT, "WiFi not connected");
          it.print(0, 29, id(font_small), TextAlign::BASELINE_LEFT, "Join 'Crescent City'");
        }
        it.printf(0, 39, id(font_small), TextAlign::BASELINE_LEFT, "HA %s", id(api_id).is_connected() ? "connected" : "waiting");
        if (id(battery_voltage).has_state())
          it.printf(0, 49, id(font_small), TextAlign::BASELINE_LEFT, "Batt %.2f V %.0f%%", id(battery_voltage).state, pct);
        else
          it.print(0, 49, id(font_small), TextAlign::BASELINE_LEFT, "Batt reading...");
        if (usb) it.printf(0, 60, id(font_small), TextAlign::BASELINE_LEFT, "USB: %s", id(charge_text).state.c_str());
        else     it.print(0, 60, id(font_small), TextAlign::BASELINE_LEFT, "On battery");
      }
